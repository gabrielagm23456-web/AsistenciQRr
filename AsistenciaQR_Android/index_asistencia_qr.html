const mapa=new Map(ESTUDIANTES.map(e=>[String(e.dni).trim(),e]));
let actual=null, scanner=null;
const hoy=()=>new Date().toLocaleDateString('es-PE');
const key='asistencia_'+new Date().toISOString().slice(0,10);
let registros=JSON.parse(localStorage.getItem(key)||'{}');
function cleanDni(v){return String(v||'').replace(/[^0-9]/g,'').trim();}
function buscarDni(raw){
  const dni=cleanDni(raw); const e=mapa.get(dni);
  document.getElementById('okMsg').style.display='none';document.getElementById('errMsg').style.display='none';
  if(!e){actual=null;document.getElementById('studentCard').style.display='none';const m=document.getElementById('errMsg');m.textContent='DNI '+dni+' no encontrado en la nómina.';m.style.display='block';return;}
  actual=e;document.getElementById('studentName').textContent=e.estudiante;document.getElementById('studentDni').textContent='DNI: '+e.dni;document.getElementById('studentGrade').textContent='Grado: '+e.grado;document.getElementById('studentSection').textContent='Sección: '+e.seccion;document.getElementById('studentCard').style.display='block';
}
function registrar(estado){
 if(!actual)return; const now=new Date(); registros[actual.dni]={...actual,estado,fecha:hoy(),hora:now.toLocaleTimeString('es-PE')}; localStorage.setItem(key,JSON.stringify(registros));
 const m=document.getElementById('okMsg');m.textContent=actual.estudiante+' registrado: '+estado;m.style.display='block';document.getElementById('studentCard').style.display='none';document.getElementById('dniInput').value='';actual=null;render();
}
function marcarFaltas(){ESTUDIANTES.forEach(e=>{if(!registros[e.dni])registros[e.dni]={...e,estado:'FALTA',fecha:hoy(),hora:''}});localStorage.setItem(key,JSON.stringify(registros));render();}
function render(){
 const arr=Object.values(registros).sort((a,b)=>(Number(a.n)||9999)-(Number(b.n)||9999));document.getElementById('tbody').innerHTML=arr.map(r=>`<tr><td>${r.dni}</td><td>${r.estudiante}</td><td>${r.grado}</td><td>${r.seccion}</td><td><b>${r.estado}</b></td><td>${r.hora||''}</td></tr>`).join('');
 document.getElementById('total').textContent=ESTUDIANTES.length; const pres=arr.filter(r=>r.estado==='ASISTIÓ'||r.estado==='TARDE').length;document.getElementById('presentes').textContent=pres;document.getElementById('faltan').textContent=Math.max(0,ESTUDIANTES.length-pres);
}
async function startScanner(){
 try{if(scanner)return;scanner=new Html5Qrcode('reader');const cams=await Html5Qrcode.getCameras();if(!cams.length)throw new Error('No se encontró cámara');let cam=cams.find(c=>/back|rear|environment|trasera/i.test(c.label))||cams[cams.length-1];await scanner.start(cam.id,{fps:10,qrbox:{width:250,height:250}},txt=>{buscarDni(txt);},()=>{});}catch(e){const m=document.getElementById('errMsg');m.textContent='No se pudo abrir la cámara: '+e.message+'. Revise el permiso de cámara.';m.style.display='block';scanner=null;}
}
async function stopScanner(){if(scanner){try{await scanner.stop();await scanner.clear();}catch(e){}scanner=null;}}
function exportarExcel(){
 let rows=ESTUDIANTES.map(e=>{const r=registros[e.dni]||{...e,estado:'FALTA',fecha:hoy(),hora:''};return {N:e.n,GRADO:e.grado,'SECCIÓN':e.seccion,DNI:e.dni,ESTUDIANTE:e.estudiante,ESTADO:r.estado,FECHA:r.fecha,HORA:r.hora}});
 const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Asistencia');XLSX.writeFile(wb,'Asistencia_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function reiniciarDia(){if(confirm('¿Borrar todos los registros de hoy?')){registros={};localStorage.removeItem(key);render();}}
document.getElementById('dniInput').addEventListener('keydown',e=>{if(e.key==='Enter')buscarDni(e.target.value)});document.getElementById('startBtn').onclick=startScanner;document.getElementById('stopBtn').onclick=stopScanner;render();
